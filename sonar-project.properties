# SonarQube / SonarCloud configuration for memex.
# Requires SONAR_TOKEN (secret) in GitHub Actions.
# Optional: SONAR_HOST_URL repo variable for self-hosted SonarQube (defaults to SonarCloud).

sonar.projectKey=kioie_memex
sonar.projectName=memex
sonar.organization=kioie
sonar.host.url=https://sonarcloud.io

# Production code analyzed for bugs, smells, security, and duplication.
sonar.sources=memex,cmd/memex
sonar.tests=memex,cmd/memex,integration
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,integration/**

# Go test coverage (generated by make coverage-sonar in CI).
sonar.go.coverage.reportPaths=coverage.out
# CLI is subprocess-tested; exclude from coverage metrics (still analyzed statically).
sonar.coverage.exclusions=cmd/memex/**

# Strict new-code baseline: compare feature branches and PRs against main.
sonar.newCode.referenceBranch=main

# Detect smaller duplicated blocks than the default threshold.
sonar.cpd.minimumTokens=50

# Quality gate enforcement is handled in CI (scan + quality-gate-action).
# Timeout for scanner-side wait if enabled via -D overrides.
sonar.qualitygate.timeout=600
