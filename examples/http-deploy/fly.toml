# fly.toml — deploy from repository root:
#   fly deploy --config examples/http-deploy/fly.toml
app = 'memex-http'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  MEMEX_DIR = '/data'
  MEMEX_VERBOSE = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'

# Optional: mount a Fly volume at /data for durable hosted memory
# [[mounts]]
#   source = 'memex_data'
#   destination = '/data'
